name = "folia-cf-seance"
main = "src/index.js"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]

# workers_dev must be explicit once routes are declared, or the workers.dev
# preview url is turned off -- which is the url used to check this worker
# before and after a change.
workers_dev = true

# The hostnames this worker answers on. custom_domain means Cloudflare owns the
# DNS record and the certificate. Recorded here so the repo, not a dashboard,
# says which worker serves which hostname -- and so the binding is recreated if
# the worker ever is.
routes = [
  { pattern = "dotcom-seance.folia.app", custom_domain = true },
  { pattern = "dead-dotcom-seance.folia.app", custom_domain = true },
]

[assets]
directory = "../dist"
binding = "ASSETS"
html_handling = "none"
not_found_handling = "none"

[alias]
dotenv = "./src/shims/dotenv.js"
encoding = "./src/shims/encoding.js"

[vars]
# Copied from the Netlify site config; these are the base of every url the
# metadata documents publish, so they have to match exactly.
VUE_APP_CANONICAL_DOMAIN = "https://www.dotcomseance.com"
VUE_APP_IPFS_ORIGIN = "https://following-quelea-awffk.lighthouseweb3.xyz"
